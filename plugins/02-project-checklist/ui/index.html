<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目任务清单</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas; --fg: CanvasText; --muted: color-mix(in srgb, CanvasText 60%, transparent);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
      --card: color-mix(in srgb, CanvasText 4%, Canvas);
      --accent: #2563eb; --high: #dc2626; --med: #d97706; --low: #16a34a;
      font: 14px/1.5 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    main { max-width: 920px; margin: 0 auto; padding: clamp(12px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 18px; margin: 0; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 560px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .metric { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--card); }
    .metric strong { font-size: 18px; display: block; }
    .metric span { font-size: 12px; color: var(--muted); }
    .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); transition: width .2s ease; }
    .form { display: grid; grid-template-columns: 2fr 1fr 110px auto; gap: 8px; align-items: end; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--card); }
    @media (max-width: 680px) { .form { grid-template-columns: 1fr; } }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; }
    input, select, button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; background: var(--bg); }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip { padding: 4px 10px; border-radius: 99px; font-size: 12px; }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 9px; padding: 10px; background: var(--card); }
    .row.done .title { text-decoration: line-through; color: var(--muted); }
    .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); margin-right: 6px; }
    .p-high { color: var(--high); border-color: color-mix(in srgb, var(--high) 50%, transparent); }
    .p-medium { color: var(--med); border-color: color-mix(in srgb, var(--med) 50%, transparent); }
    .p-low { color: var(--low); border-color: color-mix(in srgb, var(--low) 50%, transparent); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .status { font-size: 13px; color: var(--muted); margin: 0; }
    .status[data-error="true"] { color: var(--high); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>项目任务清单</h1>
      <button id="btn-refresh" type="button">刷新</button>
    </header>

    <section class="metrics">
      <div class="metric"><strong id="m-total">0</strong><span>总任务</span></div>
      <div class="metric"><strong id="m-todo">0</strong><span>待开始</span></div>
      <div class="metric"><strong id="m-doing">0</strong><span>进行中</span></div>
      <div class="metric"><strong id="m-pct">0%</strong><span>完成率</span></div>
    </section>
    <div class="bar"><div id="progress" style="width:0%"></div></div>

    <form id="add-form" class="form">
      <label>任务标题 <input id="f-title" placeholder="例如：完成插件接口回归测试" maxlength="120" required autocomplete="off"></label>
      <label>里程碑 <input id="f-milestone" placeholder="例如：v1.0" maxlength="48" autocomplete="off"></label>
      <label>优先级
        <select id="f-priority">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
      </label>
      <button class="primary" type="submit">添加任务</button>
    </form>

    <div class="filters">
      <button class="chip active" data-filter="all" type="button">全部</button>
      <button class="chip" data-filter="todo" type="button">待开始</button>
      <button class="chip" data-filter="doing" type="button">进行中</button>
      <button class="chip" data-filter="done" type="button">已完成</button>
    </div>

    <p id="status" class="status" role="status">正在读取当前项目任务…</p>
    <section id="list" class="list"></section>
  </main>
  <script>
    (() => {
      const plugin = globalThis.nmasPlugin;
      const $ = id => document.getElementById(id);
      const P_LABEL = { high: '高优先级', medium: '中优先级', low: '低优先级' };
      const NEXT_STATE = { todo: 'doing', doing: 'done', done: 'todo' };
      const STATE_LABEL = { todo: '待开始', doing: '进行中', done: '已完成' };
      let revision = 0, items = [], filter = 'all', busy = false;

      const setStatus = (text, err = false) => { $('status').textContent = text; $('status').dataset.error = String(err); };

      function render(summary) {
        if (summary) {
          $('m-total').textContent = String(summary.total);
          $('m-todo').textContent = String(summary.todo);
          $('m-doing').textContent = String(summary.doing);
          $('m-pct').textContent = `${summary.completion_pct}%`;
          $('progress').style.width = `${summary.completion_pct}%`;
        }
        const list = $('list');
        list.replaceChildren();
        const shown = items.filter(i => filter === 'all' || i.state === filter);
        if (!shown.length) {
          const p = document.createElement('p');
          p.className = 'status';
          p.textContent = items.length ? '当前筛选下没有任务' : '当前项目暂无任务，上方输入即可添加';
          list.appendChild(p);
          return;
        }
        for (const item of shown) {
          const row = document.createElement('div');
          row.className = `row${item.state === 'done' ? ' done' : ''}`;
          const stateBtn = document.createElement('button');
          stateBtn.type = 'button';
          stateBtn.textContent = STATE_LABEL[item.state];
          stateBtn.title = '点击切换状态';
          stateBtn.addEventListener('click', () => updateItem({ ...item, state: NEXT_STATE[item.state] }));

          const body = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = item.title;
          const meta = document.createElement('div');
          meta.className = 'meta';
          const badge = document.createElement('span');
          badge.className = `badge p-${item.priority}`;
          badge.textContent = P_LABEL[item.priority];
          meta.appendChild(badge);
          if (item.milestone) meta.append(`里程碑：${item.milestone}`);
          if (item.note) meta.append(` · ${item.note}`);
          body.append(title, meta);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.textContent = '删除';
          delBtn.addEventListener('click', () => removeItem(item.id));

          row.append(stateBtn, body, delBtn);
          list.appendChild(row);
        }
      }

      async function load() {
        if (typeof plugin?.action !== 'function') { setStatus('请在 Velai Desktop 项目会话中打开此插件。', true); return; }
        try {
          const data = await plugin.action('tasks.list', {});
          revision = data.revision;
          items = data.items;
          render(data.summary);
          setStatus(`项目清单已同步（修订 #${revision}）`);
        } catch (err) {
          setStatus(`读取失败：${err?.message || '请确认已选择项目主会话'}`, true);
        }
      }

      async function updateItem(item) {
        if (busy) return;
        busy = true;
        try {
          const res = await plugin.action('tasks.upsert', { expected_revision: revision, ...item });
          if (res.status === 'saved') await load();
          else setStatus(`操作未完成：${res.status}`, true);
        } catch (err) {
          setStatus(`更新失败：${err?.message || '未知错误'}`, true);
        } finally { busy = false; }
      }

      async function removeItem(id) {
        if (busy) return;
        busy = true;
        try {
          const res = await plugin.action('tasks.remove', { expected_revision: revision, id });
          if (res.status === 'deleted') await load();
          else setStatus(`删除未完成：${res.status}`, true);
        } catch (err) {
          setStatus(`删除失败：${err?.message || '未知错误'}`, true);
        } finally { busy = false; }
      }

      $('add-form').addEventListener('submit', async e => {
        e.preventDefault();
        const title = $('f-title').value.trim();
        if (!title) return;
        await updateItem({
          id: `t-${Date.now().toString(36)}`,
          title,
          milestone: $('f-milestone').value.trim(),
          priority: $('f-priority').value,
          state: 'todo',
          note: '',
        });
        $('f-title').value = '';
        $('f-title').focus();
      });

      $('btn-refresh').addEventListener('click', load);
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          filter = btn.dataset.filter;
          document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
          render();
        });
      });

      void load();
    })();
  </script>
</body>
</html>
