<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>目标进度追踪器 (OKR)</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas; --fg: CanvasText; --muted: color-mix(in srgb, CanvasText 60%, transparent);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
      --card: color-mix(in srgb, CanvasText 4%, Canvas);
      --accent: #2563eb; --ok: #16a34a; --danger: #dc2626;
      font: 14px/1.55 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    main { max-width: 920px; margin: 0 auto; padding: clamp(12px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 12px; }
    header, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    h1 { font-size: 18px; margin: 0; }
    .banner { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .big { font-size: 26px; font-weight: 700; color: var(--accent); }
    .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; flex: 1; min-width: 120px; }
    .bar > div { height: 100%; background: var(--accent); }
    .card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 10px; }
    .kr { display: grid; grid-template-columns: minmax(0, 1fr) 90px 90px 64px auto; gap: 6px; align-items: center; }
    @media (max-width: 640px) { .kr { grid-template-columns: 1fr 1fr; } }
    input, button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; background: var(--bg); }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    .status { font-size: 13px; color: var(--muted); margin: 0; }
    .status[data-error="true"] { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>目标进度追踪器 (OKR)</h1>
      <button id="btn-refresh" type="button">刷新</button>
    </header>

    <section class="banner">
      <div>
        <div class="status">整体达成率</div>
        <div id="overall" class="big">0%</div>
      </div>
      <div class="bar"><div id="overall-bar" style="width:0%"></div></div>
    </section>

    <section class="card">
      <strong>新增目标 (Objective)</strong>
      <div class="row">
        <input id="n-cycle" value="2026-Q4" placeholder="周期（如 2026-Q4）" maxlength="24" style="width:130px">
        <input id="n-title" placeholder="目标描述（如：构建完善的 Velai 插件生态）" maxlength="120" style="flex:1;min-width:180px">
        <input id="n-kr" placeholder="首个关键结果 KR1" maxlength="100" style="flex:1;min-width:160px">
        <input id="n-target" type="number" min="1" value="10" style="width:86px" title="目标值">
        <input id="n-unit" value="个" maxlength="16" style="width:68px" title="单位">
        <button id="btn-add" class="primary" type="button">创建目标</button>
      </div>
    </section>

    <p id="status" class="status" role="status">正在加载 OKR…</p>
    <section id="list" style="display:flex;flex-direction:column;gap:10px"></section>
  </main>
  <script>
    (() => {
      const plugin = globalThis.nmasPlugin;
      const $ = id => document.getElementById(id);
      let revision = 0, objectives = [], busy = false;
      const setStatus = (t, e = false) => { $('status').textContent = t; $('status').dataset.error = String(e); };

      function render(overall) {
        $('overall').textContent = `${overall}%`;
        $('overall-bar').style.width = `${overall}%`;
        const box = $('list');
        box.replaceChildren();
        if (!objectives.length) {
          const p = document.createElement('p');
          p.className = 'status';
          p.textContent = '暂无目标，请在上方创建第一个 OKR';
          box.appendChild(p);
          return;
        }
        for (const obj of objectives) {
          const card = document.createElement('article');
          card.className = 'card';
          const head = document.createElement('div');
          head.className = 'row';
          const left = document.createElement('div');
          left.innerHTML = '';
          const title = document.createElement('strong');
          title.textContent = `[${obj.cycle}] ${obj.title}`;
          const pct = document.createElement('span');
          pct.className = 'status';
          pct.style.marginLeft = '8px';
          pct.textContent = `达成 ${obj.progress_pct}%`;
          left.append(title, pct);
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'danger';
          del.textContent = '删除';
          del.addEventListener('click', () => removeObjective(obj.id));
          head.append(left, del);

          const bar = document.createElement('div');
          bar.className = 'bar';
          const fill = document.createElement('div');
          fill.style.width = `${obj.progress_pct}%`;
          bar.appendChild(fill);
          card.append(head, bar);

          for (const kr of obj.krs) {
            const row = document.createElement('div');
            row.className = 'kr';
            const name = document.createElement('span');
            name.textContent = `${kr.title} (${kr.pct}%)`;
            const cur = document.createElement('input');
            cur.type = 'number';
            cur.min = '0';
            cur.step = 'any';
            cur.value = String(kr.current);
            const tgt = document.createElement('span');
            tgt.className = 'status';
            tgt.textContent = `/ ${kr.target} ${kr.unit}`;
            const saveBtn = document.createElement('button');
            saveBtn.type = 'button';
            saveBtn.textContent = '更新';
            saveBtn.addEventListener('click', () => {
              const nextVal = Number(cur.value);
              if (!Number.isFinite(nextVal) || nextVal < 0) return;
              const nextKrs = obj.krs.map(k => ({
                id: k.id,
                title: k.title,
                current: k.id === kr.id ? nextVal : k.current,
                target: k.target,
                unit: k.unit,
              }));
              void saveObjective({ id: obj.id, cycle: obj.cycle, title: obj.title, krs: nextKrs });
            });
            row.append(name, cur, tgt, saveBtn);
            card.appendChild(row);
          }

          const addKrRow = document.createElement('div');
          addKrRow.className = 'row';
          const krTitle = document.createElement('input');
          krTitle.placeholder = '追加一条关键结果…';
          krTitle.style.flex = '1';
          const krTarget = document.createElement('input');
          krTarget.type = 'number';
          krTarget.min = '1';
          krTarget.value = '100';
          krTarget.style.width = '84px';
          const krUnit = document.createElement('input');
          krUnit.value = '%';
          krUnit.style.width = '60px';
          const addKrBtn = document.createElement('button');
          addKrBtn.type = 'button';
          addKrBtn.textContent = '+ 添加 KR';
          addKrBtn.addEventListener('click', () => {
            if (!krTitle.value.trim()) return;
            const target = Number(krTarget.value);
            if (!Number.isFinite(target) || target <= 0) return;
            const nextKrs = [
              ...obj.krs.map(({ id, title, current, target, unit }) => ({ id, title, current, target, unit })),
              { id: `kr-${Date.now().toString(36)}`, title: krTitle.value.trim(), current: 0, target, unit: krUnit.value.trim() },
            ];
            void saveObjective({ id: obj.id, cycle: obj.cycle, title: obj.title, krs: nextKrs });
          });
          addKrRow.append(krTitle, krTarget, krUnit, addKrBtn);
          card.appendChild(addKrRow);

          box.appendChild(card);
        }
      }

      async function load() {
        if (typeof plugin?.action !== 'function') { setStatus('请在 Velai Desktop 中打开此插件。', true); return; }
        try {
          const res = await plugin.action('okr.read', {});
          revision = res.revision;
          objectives = res.objectives;
          render(res.overall_pct);
          setStatus(`已加载 ${objectives.length} 个目标（修订 #${revision}）`);
        } catch (e) { setStatus(`读取失败：${e?.message || '未知错误'}`, true); }
      }

      async function saveObjective(payload) {
        if (busy) return;
        busy = true;
        try {
          const res = await plugin.action('okr.save', { expected_revision: revision, ...payload });
          if (res.status === 'saved') await load();
          else setStatus(`保存未完成：${res.status}`, true);
        } catch (e) { setStatus(`保存失败：${e?.message || '未知错误'}`, true); }
        finally { busy = false; }
      }

      async function removeObjective(id) {
        if (busy) return;
        busy = true;
        try {
          const res = await plugin.action('okr.delete', { expected_revision: revision, id });
          if (res.status === 'deleted') await load();
          else setStatus(`删除未完成：${res.status}`, true);
        } catch (e) { setStatus(`删除失败：${e?.message || '未知错误'}`, true); }
        finally { busy = false; }
      }

      $('btn-add').addEventListener('click', () => {
        const title = $('n-title').value.trim();
        const cycle = $('n-cycle').value.trim();
        const krText = $('n-kr').value.trim();
        const target = Number($('n-target').value);
        if (!title || !cycle || !krText || !Number.isFinite(target) || target <= 0) {
          setStatus('请完整填写周期、目标、首个 KR 和有效目标值。', true);
          return;
        }
        $('n-title').value = '';
        $('n-kr').value = '';
        void saveObjective({
          id: `obj-${Date.now().toString(36)}`,
          cycle,
          title,
          krs: [{ id: 'kr-1', title: krText, current: 0, target, unit: $('n-unit').value.trim() }],
        });
      });

      $('btn-refresh').addEventListener('click', load);
      void load();
    })();
  </script>
</body>
</html>
