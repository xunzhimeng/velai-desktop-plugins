<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目决策记录 (ADR)</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas; --fg: CanvasText; --muted: color-mix(in srgb, CanvasText 60%, transparent);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
      --card: color-mix(in srgb, CanvasText 4%, Canvas);
      --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
      font: 14px/1.55 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    main { max-width: 960px; margin: 0 auto; padding: clamp(12px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 12px; }
    header, .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 14px; margin: 0; }
    .grid { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 14px; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 10px; }
    .list { display: flex; flex-direction: column; gap: 6px; max-height: 440px; overflow: auto; }
    .card { text-align: left; width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--fg); cursor: pointer; }
    .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); margin-left: 6px; }
    .s-accepted { color: var(--ok); }
    .s-proposed { color: var(--accent); }
    .s-superseded { color: var(--warn); }
    .s-deprecated { color: var(--danger); }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
    input, select, textarea, button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; background: var(--bg); }
    textarea { min-height: 76px; resize: vertical; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    .status { font-size: 13px; color: var(--muted); margin: 0; }
    .status[data-error="true"] { color: var(--danger); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>项目架构决策记录 (ADR)</h1>
      <div class="bar">
        <button id="btn-new" class="primary" type="button">+ 记录新决策</button>
        <button id="btn-refresh" type="button">刷新</button>
      </div>
    </header>
    <p id="status" class="status" role="status">正在加载项目 ADR…</p>
    <div class="grid">
      <section class="panel">
        <h2>决策目录 (<span id="count">0</span>)</h2>
        <div id="list" class="list"></div>
      </section>
      <section class="panel">
        <div class="bar">
          <h2 id="form-title">新建决策</h2>
          <div class="bar">
            <button id="btn-save" class="primary" type="button">保存决策</button>
            <button id="btn-del" class="danger" type="button" hidden>删除</button>
          </div>
        </div>
        <div class="bar">
          <label style="flex:1;min-width:160px">决策标题 <input id="f-title" maxlength="100" placeholder="例如：插件本地数据采用 CAS 乐观锁"></label>
          <label style="width:130px">状态
            <select id="f-status">
              <option value="proposed">提议中</option>
              <option value="accepted">已采纳</option>
              <option value="superseded">已替代</option>
              <option value="deprecated">已废弃</option>
            </select>
          </label>
        </div>
        <label>背景与约束 <textarea id="f-context" maxlength="600" placeholder="为什么需要做这个决策？面临什么约束？"></textarea></label>
        <label>决策结论 <textarea id="f-decision" maxlength="600" placeholder="最终选定的方案与边界"></textarea></label>
        <label>影响与权衡 <textarea id="f-consequences" maxlength="600" placeholder="带来的收益、代价与后续动作"></textarea></label>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const plugin = globalThis.nmasPlugin;
      const $ = id => document.getElementById(id);
      const LABELS = { proposed: '提议中', accepted: '已采纳', superseded: '已替代', deprecated: '已废弃' };
      let revision = 0, records = [], activeId = 'NEW', busy = false;
      const setStatus = (t, e = false) => { $('status').textContent = t; $('status').dataset.error = String(e); };

      function select(id) {
        activeId = id;
        const rec = records.find(r => r.id === id);
        $('form-title').textContent = rec ? `${rec.id} · ${rec.date}` : '新建决策（自动编号）';
        $('f-title').value = rec?.title ?? '';
        $('f-status').value = rec?.status ?? 'proposed';
        $('f-context').value = rec?.context ?? '';
        $('f-decision').value = rec?.decision ?? '';
        $('f-consequences').value = rec?.consequences ?? '';
        $('btn-del').hidden = !rec;
        renderList();
      }
      function renderList() {
        $('count').textContent = String(records.length);
        const list = $('list');
        list.replaceChildren();
        if (!records.length) {
          const p = document.createElement('p');
          p.className = 'status';
          p.textContent = '当前项目尚无决策记录';
          list.appendChild(p);
          return;
        }
        for (const r of records) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `card${r.id === activeId ? ' active' : ''}`;
          const top = document.createElement('div');
          const strong = document.createElement('strong');
          strong.textContent = r.id;
          const pill = document.createElement('span');
          pill.className = `pill s-${r.status}`;
          pill.textContent = LABELS[r.status];
          top.append(strong, pill);
          const sub = document.createElement('div');
          sub.textContent = r.title;
          btn.append(top, sub);
          btn.addEventListener('click', () => select(r.id));
          list.appendChild(btn);
        }
      }
      async function load(preferId) {
        if (typeof plugin?.action !== 'function') { setStatus('请在 Velai Desktop 项目会话中打开此插件。', true); return; }
        try {
          const res = await plugin.action('adr.list', {});
          revision = res.revision;
          records = res.records;
          select(preferId && records.some(r => r.id === preferId) ? preferId : (records[0]?.id ?? 'NEW'));
          setStatus(`已加载 ${records.length} 条 ADR（修订 #${revision}）`);
        } catch (err) {
          setStatus(`加载失败：${err?.message || '请确认已选择项目主会话'}`, true);
        }
      }
      $('btn-new').addEventListener('click', () => { select('NEW'); $('f-title').focus(); });
      $('btn-refresh').addEventListener('click', () => load(activeId));
      $('btn-save').addEventListener('click', async () => {
        if (busy) return;
        const title = $('f-title').value.trim();
        const decision = $('f-decision').value.trim();
        if (!title || !decision) { setStatus('请至少填写决策标题和决策结论。', true); return; }
        busy = true;
        try {
          const res = await plugin.action('adr.save', {
            expected_revision: revision,
            id: activeId,
            title,
            status: $('f-status').value,
            context: $('f-context').value,
            decision,
            consequences: $('f-consequences').value,
          });
          if (res.status === 'saved') {
            await load(res.id);
            setStatus(`已保存 ${res.id}。`);
          } else setStatus(`保存未完成：${res.status}`, true);
        } catch (err) { setStatus(`保存失败：${err?.message || '未知错误'}`, true); }
        finally { busy = false; }
      });
      $('btn-del').addEventListener('click', async () => {
        if (busy || activeId === 'NEW') return;
        busy = true;
        try {
          const res = await plugin.action('adr.delete', { expected_revision: revision, id: activeId });
          if (res.status === 'deleted') { await load(); setStatus('决策已删除。'); }
          else setStatus(`删除未完成：${res.status}`, true);
        } catch (err) { setStatus(`删除失败：${err?.message || '未知错误'}`, true); }
        finally { busy = false; }
      });
      void load();
    })();
  </script>
</body>
</html>
