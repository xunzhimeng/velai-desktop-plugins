<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目术语表</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas; --fg: CanvasText; --muted: color-mix(in srgb, CanvasText 60%, transparent);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
      --card: color-mix(in srgb, CanvasText 4%, Canvas);
      --accent: #2563eb; --danger: #dc2626;
      font: 14px/1.55 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    main { max-width: 900px; margin: 0 auto; padding: clamp(12px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 12px; }
    header, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    h1 { font-size: 18px; margin: 0; }
    .form { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
    input, textarea, button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; background: var(--bg); }
    textarea { width: 100%; min-height: 64px; resize: vertical; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--card); font-size: 12px; color: var(--muted); }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); }
    .status { font-size: 13px; color: var(--muted); margin: 0; }
    .status[data-error="true"] { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>项目术语表</h1>
      <div class="row">
        <input id="search" type="search" placeholder="筛选术语、缩写或定义…" autocomplete="off">
        <button id="btn-refresh" type="button">刷新</button>
      </div>
    </header>

    <section class="form">
      <div class="row">
        <input id="f-term" placeholder="术语 / 缩写（如：CAS）" maxlength="64" style="flex:1;min-width:140px" autocomplete="off">
        <input id="f-alias" placeholder="别名 / 英文全称" maxlength="80" style="flex:1;min-width:140px" autocomplete="off">
        <input id="f-domain" placeholder="领域（如：存储 / 业务）" maxlength="40" style="width:140px" autocomplete="off">
        <button id="btn-save" class="primary" type="button">保存术语</button>
      </div>
      <textarea id="f-def" maxlength="400" placeholder="准确、简洁的定义，帮助团队和 AI 保持同一口径…"></textarea>
    </section>

    <p id="status" class="status" role="status">正在读取当前项目术语表…</p>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>术语</th><th>领域</th><th>定义</th><th style="width:120px">操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
  <script>
    (() => {
      const plugin = globalThis.nmasPlugin;
      const $ = id => document.getElementById(id);
      let revision = 0, terms = [], busy = false;
      const setStatus = (t, e = false) => { $('status').textContent = t; $('status').dataset.error = String(e); };

      function render() {
        const q = $('search').value.trim().toLowerCase();
        const shown = terms.filter(t => !q || `${t.term} ${t.alias} ${t.domain} ${t.definition}`.toLowerCase().includes(q));
        const tbody = $('tbody');
        tbody.replaceChildren();
        if (!shown.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 4;
          td.className = 'status';
          td.textContent = terms.length ? '未找到匹配术语' : '当前项目尚未登记术语';
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }
        for (const t of shown) {
          const tr = document.createElement('tr');
          const tdTerm = document.createElement('td');
          const strong = document.createElement('strong');
          strong.textContent = t.term;
          tdTerm.appendChild(strong);
          if (t.alias) {
            const sub = document.createElement('div');
            sub.className = 'status';
            sub.textContent = t.alias;
            tdTerm.appendChild(sub);
          }
          const tdDom = document.createElement('td');
          if (t.domain) {
            const sp = document.createElement('span');
            sp.className = 'tag';
            sp.textContent = t.domain;
            tdDom.appendChild(sp);
          }
          const tdDef = document.createElement('td');
          tdDef.textContent = t.definition;
          const tdAct = document.createElement('td');
          const edit = document.createElement('button');
          edit.type = 'button';
          edit.textContent = '编辑';
          edit.style.marginRight = '4px';
          edit.addEventListener('click', () => {
            $('f-term').value = t.term;
            $('f-alias').value = t.alias;
            $('f-domain').value = t.domain;
            $('f-def').value = t.definition;
            $('f-def').focus();
          });
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'danger';
          del.textContent = '删';
          del.addEventListener('click', () => remove(t.term));
          tdAct.append(edit, del);
          tr.append(tdTerm, tdDom, tdDef, tdAct);
          tbody.appendChild(tr);
        }
      }

      async function load() {
        if (typeof plugin?.action !== 'function') { setStatus('请在 Velai Desktop 项目会话中打开此插件。', true); return; }
        try {
          const res = await plugin.action('glossary.list', {});
          revision = res.revision;
          terms = res.terms;
          render();
          setStatus(`共 ${terms.length} 条项目术语（修订 #${revision}）`);
        } catch (e) { setStatus(`读取失败：${e?.message || '请确认已选择项目主会话'}`, true); }
      }

      async function remove(term) {
        if (busy) return;
        busy = true;
        try {
          const res = await plugin.action('glossary.delete', { expected_revision: revision, term });
          if (res.status === 'deleted') await load();
          else setStatus(`删除未完成：${res.status}`, true);
        } catch (e) { setStatus(`删除失败：${e?.message || '未知错误'}`, true); }
        finally { busy = false; }
      }

      $('btn-save').addEventListener('click', async () => {
        if (busy) return;
        const term = $('f-term').value.trim();
        const definition = $('f-def').value.trim();
        if (!term || !definition) { setStatus('请填写术语名和定义。', true); return; }
        busy = true;
        try {
          const res = await plugin.action('glossary.save', {
            expected_revision: revision,
            term,
            alias: $('f-alias').value,
            domain: $('f-domain').value,
            definition,
          });
          if (res.status === 'saved') {
            $('f-term').value = '';
            $('f-alias').value = '';
            $('f-domain').value = '';
            $('f-def').value = '';
            await load();
            setStatus(`已保存术语「${term}」。`);
          } else setStatus(`保存未完成：${res.status}`, true);
        } catch (e) { setStatus(`保存失败：${e?.message || '未知错误'}`, true); }
        finally { busy = false; }
      });

      $('search').addEventListener('input', render);
      $('btn-refresh').addEventListener('click', load);
      void load();
    })();
  </script>
</body>
</html>
