<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON 与结构化数据工坊</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas; --fg: CanvasText; --muted: color-mix(in srgb, CanvasText 60%, transparent);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
      --card: color-mix(in srgb, CanvasText 4%, Canvas);
      --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
      font: 14px/1.5 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    main { max-width: 960px; margin: 0 auto; padding: clamp(12px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 10px; }
    header, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    h1 { font-size: 18px; margin: 0; }
    .tabs { display: flex; gap: 6px; }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    textarea, input, button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; background: var(--bg); }
    textarea { width: 100%; min-height: 200px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
    .diff-item { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--bg); }
    .k-added { border-left: 3px solid var(--ok); }
    .k-removed { border-left: 3px solid var(--danger); }
    .k-changed { border-left: 3px solid var(--warn); }
    .status { font-size: 13px; color: var(--muted); margin: 0; }
    .status[data-error="true"] { color: var(--danger); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>JSON 与结构化数据工坊</h1>
      <div class="tabs">
        <button class="tab active" data-tab="format" type="button">格式化与查询</button>
        <button class="tab" data-tab="diff" type="button">结构 Diff</button>
        <button id="btn-read" type="button" hidden>读入选中回复</button>
        <button id="btn-insert" class="primary" type="button" hidden>插入输入框</button>
      </div>
    </header>

    <p id="status" class="status" role="status">零权限纯本地计算，随时粘贴 JSON 开始处理。</p>

    <section id="pane-format" class="panel">
      <div class="row" style="justify-content:flex-start">
        <button data-mode="pretty" class="primary" type="button">美化缩进</button>
        <button data-mode="canonical" type="button">键名排序 (Canonical)</button>
        <button data-mode="minify" type="button">压缩为单行</button>
        <input id="q-path" placeholder="路径提取，如 $.items[0].name" style="flex:1;min-width:180px">
        <button id="btn-query" type="button">提取</button>
      </div>
      <div class="grid">
        <textarea id="src" placeholder='粘贴 JSON，例如 {"b": 1, "a": [{"name": "velai"}]}'></textarea>
        <textarea id="out" readonly placeholder="输出结果…"></textarea>
      </div>
    </section>

    <section id="pane-diff" class="panel" hidden>
      <div class="grid">
        <textarea id="left" placeholder="左侧（旧版）JSON"></textarea>
        <textarea id="right" placeholder="右侧（新版）JSON"></textarea>
      </div>
      <div class="row" style="justify-content:flex-start">
        <button id="btn-diff" class="primary" type="button">开始结构对比</button>
      </div>
      <div id="diff-out" style="display:flex;flex-direction:column;gap:6px"></div>
    </section>
  </main>
  <script>
    (() => {
      const plugin = globalThis.nmasPlugin;
      const $ = id => document.getElementById(id);
      const setStatus = (t, err = false) => { $('status').textContent = t; $('status').dataset.error = String(err); };

      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
          $('pane-format').hidden = tab !== 'format';
          $('pane-diff').hidden = tab !== 'diff';
        });
      });

      document.querySelectorAll('button[data-mode]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const text = $('src').value.trim();
          if (!text) { setStatus('请先输入 JSON。', true); return; }
          try {
            const res = await plugin.action('json.format', { text, mode: btn.dataset.mode });
            if (res.valid) {
              $('out').value = res.output;
              setStatus(`合法 JSON · 类型 ${res.root_type} · 深度 ${res.depth} · 键数 ${res.keys}`);
            } else {
              $('out').value = '';
              setStatus(`解析错误：${res.error}`, true);
            }
          } catch (e) { setStatus(`执行失败：${e?.message || '未知错误'}`, true); }
        });
      });

      $('btn-query').addEventListener('click', async () => {
        const text = $('src').value.trim();
        if (!text) { setStatus('请先输入 JSON。', true); return; }
        try {
          const res = await plugin.action('json.query', { text, path: $('q-path').value });
          if (res.found) {
            $('out').value = res.result;
            setStatus(`提取成功：${$('q-path').value || '$'}`);
          } else {
            setStatus(res.error || '路径未命中', true);
          }
        } catch (e) { setStatus(`查询失败：${e?.message || '未知错误'}`, true); }
      });

      $('btn-diff').addEventListener('click', async () => {
        const left = $('left').value.trim(), right = $('right').value.trim();
        if (!left || !right) { setStatus('请在左右两侧都填入 JSON。', true); return; }
        try {
          const res = await plugin.action('json.diff', { left, right });
          const box = $('diff-out');
          box.replaceChildren();
          if (!res.ok) { setStatus(res.error || '对比失败', true); return; }
          if (!res.changes.length) {
            setStatus('两段 JSON 结构与值完全一致。');
            return;
          }
          setStatus(`共发现 ${res.changes.length} 处差异。`);
          for (const c of res.changes) {
            const div = document.createElement('div');
            div.className = `diff-item k-${c.kind}`;
            div.textContent = `[${c.kind.toUpperCase()}] ${c.path}: ${c.detail}`;
            box.appendChild(div);
          }
        } catch (e) { setStatus(`对比失败：${e?.message || '未知错误'}`, true); }
      });

      $('btn-read').addEventListener('click', async () => {
        try {
          const r = await plugin.action('host.selection.read', {});
          if (typeof r?.text === 'string' && r.text.trim()) {
            $('src').value = r.text;
            setStatus('已读入选中内容。');
          }
        } catch { setStatus('无法读取选中回复。', true); }
      });

      $('btn-insert').addEventListener('click', async () => {
        const text = ($('out').value || $('src').value).trim();
        if (!text) return;
        try {
          const r = await plugin.action('host.draft.insert', { text });
          setStatus(r?.inserted ? '已插入会话输入框。' : '插入未确认。', !r?.inserted);
        } catch (e) { setStatus(`插入失败：${e?.message || '未知错误'}`, true); }
      });

      if (typeof plugin?.action === 'function') {
        plugin.action('host.capabilities', {}).then(c => {
          const acts = Array.isArray(c?.actions) ? c.actions : [];
          $('btn-read').hidden = !acts.includes('host.selection.read');
          $('btn-insert').hidden = !acts.includes('host.draft.insert');
        }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
