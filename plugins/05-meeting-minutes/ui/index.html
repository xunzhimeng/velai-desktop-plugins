<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会议纪要工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas; --fg: CanvasText; --muted: color-mix(in srgb, CanvasText 60%, transparent);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
      --card: color-mix(in srgb, CanvasText 4%, Canvas);
      --accent: #2563eb; --ok: #16a34a; --danger: #dc2626;
      font: 14px/1.55 system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    main { max-width: 960px; margin: 0 auto; padding: clamp(12px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 12px; }
    header, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 14px; margin: 0; }
    .grid { display: grid; grid-template-columns: minmax(200px, 250px) minmax(0, 1fr); gap: 14px; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 10px; }
    .list { display: flex; flex-direction: column; gap: 6px; max-height: 440px; overflow: auto; }
    .item { text-align: left; width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--fg); cursor: pointer; }
    .item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
    input, textarea, button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; background: var(--bg); }
    textarea { min-height: 110px; resize: vertical; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .ai-box { border-top: 1px dashed var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font: inherit; }
    .status { font-size: 13px; color: var(--muted); margin: 0; }
    .status[data-error="true"] { color: var(--danger); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>会议纪要工作台</h1>
      <button id="btn-new" class="primary" type="button">+ 新建会议</button>
    </header>
    <p id="status" class="status" role="status">正在加载会议记录…</p>
    <div class="grid">
      <section class="panel">
        <h2>会议列表 (<span id="count">0</span>)</h2>
        <div id="list" class="list"></div>
      </section>
      <section class="panel">
        <div class="row">
          <h2 id="heading">会议详情</h2>
          <div class="row">
            <button id="btn-save" class="primary" type="button">保存</button>
            <button id="btn-del" class="danger" type="button" hidden>删除</button>
          </div>
        </div>
        <div class="row">
          <label style="flex:1;min-width:160px">会议主题 <input id="f-title" maxlength="100" placeholder="例如：桌面端插件生态评审会"></label>
          <label style="width:140px">日期 <input id="f-date" type="date"></label>
        </div>
        <label>参会人 <input id="f-attendees" maxlength="160" placeholder="例如：张三、李四、王五"></label>
        <label>原始速记 <textarea id="f-raw" maxlength="3072" placeholder="记录会议要点、讨论分歧、临时决定…"></textarea></label>
        <div class="row">
          <button id="btn-extract" class="primary" type="button">交给当前会话提炼纪要与行动项</button>
          <button id="btn-check" type="button" hidden>核对提炼结果</button>
        </div>
        <div id="ai-box" class="ai-box" hidden>
          <p id="ai-state" class="status"></p>
          <pre id="ai-preview" hidden></pre>
          <div class="row">
            <button id="btn-adopt" class="primary" type="button" hidden>采纳并写入下方纪要</button>
          </div>
        </div>
        <label>结构化纪要与行动项 <textarea id="f-summary" maxlength="3072" placeholder="可手动编写，或点击上方按钮由当前会话提炼后采纳"></textarea></label>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const plugin = globalThis.nmasPlugin;
      const $ = id => document.getElementById(id);
      let revision = 0, meetings = [], activeId = null, busy = false, pendingWorkId = null, latestSuggestion = '';
      const today = () => new Date().toISOString().slice(0, 10);
      const setStatus = (t, err = false) => { $('status').textContent = t; $('status').dataset.error = String(err); };

      function uuid() {
        const b = crypto.getRandomValues(new Uint8Array(16));
        b[6] = (b[6] & 0x0f) | 0x40;
        b[8] = (b[8] & 0x3f) | 0x80;
        const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
        return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
      }

      function select(id) {
        activeId = id;
        const m = meetings.find(x => x.id === id);
        $('heading').textContent = m ? m.title : '新建会议';
        $('f-title').value = m?.title ?? '';
        $('f-date').value = m?.date ?? today();
        $('f-attendees').value = m?.attendees ?? '';
        $('f-raw').value = m?.raw_notes ?? '';
        $('f-summary').value = m?.summary ?? '';
        $('btn-del').hidden = !m;
        renderList();
      }

      function renderList() {
        $('count').textContent = String(meetings.length);
        const box = $('list');
        box.replaceChildren();
        if (!meetings.length) {
          const p = document.createElement('p');
          p.className = 'status';
          p.textContent = '暂无会议记录';
          box.appendChild(p);
          return;
        }
        for (const m of meetings) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `item${m.id === activeId ? ' active' : ''}`;
          const t = document.createElement('strong');
          t.textContent = m.title;
          const d = document.createElement('div');
          d.className = 'status';
          d.textContent = `${m.date}${m.summary ? ' · 已整理' : ' · 草稿'}`;
          btn.append(t, d);
          btn.addEventListener('click', () => select(m.id));
          box.appendChild(btn);
        }
      }

      async function load(preferId) {
        if (typeof plugin?.action !== 'function') { setStatus('请在 Velai Desktop 中打开此插件。', true); return; }
        try {
          const res = await plugin.action('minutes.read', {});
          revision = res.revision;
          meetings = res.meetings;
          select(preferId && meetings.some(m => m.id === preferId) ? preferId : (meetings[0]?.id ?? null));
          setStatus(`已加载 ${meetings.length} 场会议（修订 #${revision}）`);
        } catch (e) { setStatus(`读取失败：${e?.message || '未知错误'}`, true); }
      }

      async function saveCurrent() {
        if (busy) return false;
        const title = $('f-title').value.trim();
        const date = $('f-date').value || today();
        if (!title) { setStatus('请填写会议主题。', true); return false; }
        busy = true;
        try {
          const id = activeId || `mt-${Date.now().toString(36)}`;
          const res = await plugin.action('minutes.save', {
            expected_revision: revision,
            id,
            title,
            date,
            attendees: $('f-attendees').value,
            raw_notes: $('f-raw').value,
            summary: $('f-summary').value,
          });
          if (res.status === 'saved') {
            await load(id);
            setStatus('会议记录已保存。');
            return true;
          }
          setStatus(`保存未完成：${res.status}`, true);
          return false;
        } catch (e) {
          setStatus(`保存失败：${e?.message || '未知错误'}`, true);
          return false;
        } finally { busy = false; }
      }

      $('btn-new').addEventListener('click', () => { select(null); $('f-title').focus(); });
      $('btn-save').addEventListener('click', () => void saveCurrent());
      $('btn-del').addEventListener('click', async () => {
        if (busy || !activeId) return;
        busy = true;
        try {
          const res = await plugin.action('minutes.delete', { expected_revision: revision, id: activeId });
          if (res.status === 'deleted') { await load(); setStatus('已删除会议记录。'); }
          else setStatus(`删除未完成：${res.status}`, true);
        } catch (e) { setStatus(`删除失败：${e?.message || '未知错误'}`, true); }
        finally { busy = false; }
      });

      $('btn-extract').addEventListener('click', async () => {
        const raw = $('f-raw').value.trim();
        if (!raw) { setStatus('请先填写原始速记再交给会话提炼。', true); return; }
        const prompt = `请把下面的会议速记整理为结构化纪要，包含：1. 核心结论；2. 行动项（负责人/事项/截止时间）；3. 待跟进风险。仅输出整理后的纯文本内容。\n\n会议主题：${$('f-title').value.trim() || '未命名会议'}\n参会人：${$('f-attendees').value.trim() || '未填写'}\n\n原始速记：\n${raw}`;
        if (Array.from(prompt).length > 2048) { setStatus('速记过长，请精简至 1800 字以内。', true); return; }
        pendingWorkId = uuid();
        latestSuggestion = '';
        $('ai-box').hidden = false;
        $('ai-preview').hidden = true;
        $('btn-adopt').hidden = true;
        $('btn-check').hidden = false;
        $('ai-state').textContent = '正在向当前会话派发提炼请求…';
        try {
          await plugin.action('session.turn.request', { prompt, work_id: pendingWorkId });
          $('ai-state').textContent = '已派发给当前会话，请等待回复完成后点击「核对提炼结果」。';
        } catch (e) {
          $('ai-state').textContent = e?.message === 'cancelled'
            ? '已取消派发，请先在宿主中选择一个会话。'
            : `派发未确认（${e?.message || 'unknown'}），请到原会话核对。`;
        }
      });

      $('btn-check').addEventListener('click', async () => {
        if (!pendingWorkId) return;
        $('ai-state').textContent = '正在核对会话结果…';
        try {
          const r = await plugin.action('session.turn.result', { work_id: pendingWorkId });
          if (r.state === 'completed' && !r.truncated && typeof r.text === 'string' && r.text.trim()) {
            latestSuggestion = r.text.trim();
            $('ai-state').textContent = '已取得完整提炼结果，确认无误后点击采纳。';
            $('ai-preview').textContent = latestSuggestion;
            $('ai-preview').hidden = false;
            $('btn-adopt').hidden = false;
          } else {
            $('ai-state').textContent = `当前状态：${r.state}${r.truncated ? '（内容被截断，请回原会话查看）' : ''}`;
          }
        } catch (e) {
          $('ai-state').textContent = `核对失败：${e?.message || '请回到原会话查看'}`;
        }
      });

      $('btn-adopt').addEventListener('click', async () => {
        if (!latestSuggestion) return;
        $('f-summary').value = latestSuggestion.slice(0, 3072);
        const ok = await saveCurrent();
        if (ok) {
          pendingWorkId = null;
          latestSuggestion = '';
          $('ai-box').hidden = true;
          $('btn-check').hidden = true;
        }
      });

      void load();
    })();
  </script>
</body>
</html>
